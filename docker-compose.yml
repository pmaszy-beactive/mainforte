# Build-only compose (backbone deploy.sh uses it to build images; runtime config is backbone's).
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
  base:
    image: mainforte-base
    build:
      context: .
      dockerfile: Dockerfile.base
  worker:
    image: mainforte-worker
    build:
      context: .
      dockerfile: Dockerfile.worker
    depends_on: [base]
  sandbox:
    image: mainforte-sandbox
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    depends_on: [base]
  launcherd:
    build:
      context: .
      dockerfile: Dockerfile.launcherd
