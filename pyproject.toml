[project]
name = "mainforte"
version = "0.1.47"
description = "Mainforte v3 — AI staff that actually do the work"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic[email]>=2.8",
  "pydantic-settings>=2.4",
  "redis>=5.0",
  "celery>=5.4",
  "kombu>=5.4",
  "python-jose[cryptography]>=3.3",
  "argon2-cffi>=23.1",
  "httpx>=0.27",
  "authlib>=1.3",
  "sendgrid>=6.11",
  "stripe>=10.0",
  "boto3>=1.35",
  "cryptography>=43",
  "ulid-py>=1.1",
  "python-multipart>=0.0.9",
  "orjson>=3.10",
  "structlog>=24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/mainforte"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]  # B008: FastAPI Depends()/Query() in defaults is the framework idiom

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
